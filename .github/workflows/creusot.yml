name: Creusot Verification
# Advisory during rollout; intentionally outside rust-required-status-check.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/creusot.yml'
      - 'rust/otap-dataflow/tools/creusot-rate-bucket/**'
      - 'rust/otap-dataflow/tools/creusot-checkpoint/**'
      - 'rust/otap-dataflow/crates/filelog-checkpoint/**'
      - 'rust/otap-dataflow/crates/engine/src/admission/**'
      - 'rust/otap-dataflow/crates/engine/Cargo.toml'
      - 'rust/otap-dataflow/Cargo.toml'
      - 'rust/otap-dataflow/Cargo.lock'
      - 'rust/otap-dataflow/rust-toolchain.toml'
      - 'rust/otap-dataflow/.cargo/**'
      - 'rust/otap-dataflow/docs/creusot-verification.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/creusot.yml'
      - 'rust/otap-dataflow/tools/creusot-rate-bucket/**'
      - 'rust/otap-dataflow/tools/creusot-checkpoint/**'
      - 'rust/otap-dataflow/crates/filelog-checkpoint/**'
      - 'rust/otap-dataflow/crates/engine/src/admission/**'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint-runtime:
    if: github.event_name != 'schedule' || github.repository == 'open-telemetry/otel-arrow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.98.1
      - name: Check concrete replay against the independent transaction model
        working-directory: rust/otap-dataflow
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: >-
          cargo +1.98.1 test --locked
          -p otel-arrow-dfe-filelog-checkpoint -- --test-threads=1

  kernels:
    if: github.event_name != 'schedule' || github.repository == 'open-telemetry/otel-arrow'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check verification evidence handling
        run: |
          python3 -m unittest discover -s rust/otap-dataflow/tools/creusot-rate-bucket -p 'test_*.py'
          python3 -m unittest discover -s rust/otap-dataflow/tools/creusot-checkpoint -p 'test_*.py'
      - name: Prepare checksum-verified toolchain sources
        run: rust/otap-dataflow/tools/creusot-rate-bucket/build.sh --prepare-only
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.26.1
      - name: Build the pinned verifier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: rust/otap-dataflow/tools/creusot-rate-bucket
          platforms: linux/amd64
          load: true
          push: false
          tags: otel-arrow-creusot-rate-bucket:0.14.0
          build-contexts: |
            why3-source=rust/otap-dataflow/tools/creusot-rate-bucket/target/toolchain-sources/why3
            opam-source=rust/otap-dataflow/tools/creusot-rate-bucket/target/toolchain-sources/opam
          cache-from: type=gha,scope=creusot-rate-bucket-v1
          # Only trusted main runs write caches. Keep intermediate compiler/OCaml layers.
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'type=gha,scope=creusot-rate-bucket-v1,mode=max' || '' }}
      - name: Prove shared arithmetic and reject negative controls
        run: python3 rust/otap-dataflow/tools/creusot-rate-bucket/verify.py --skip-build
      - name: Prove checkpoint transitions and reject negative controls
        run: python3 rust/otap-dataflow/tools/creusot-checkpoint/verify.py --skip-build
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creusot-rate-bucket-${{ github.sha }}
          path: rust/otap-dataflow/tools/creusot-rate-bucket/target/reports
          if-no-files-found: warn
          retention-days: 14
      - name: Upload checkpoint verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creusot-checkpoint-${{ github.sha }}
          path: rust/otap-dataflow/tools/creusot-checkpoint/target/reports
          if-no-files-found: warn
          retention-days: 14
