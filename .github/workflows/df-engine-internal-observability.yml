name: df-engine-internal-observability

# Validates the exhaustive semantic-convention v2 contract for OTAP Dataflow.
# Weaver checks the registry syntax and references. The Rust source inventory
# check rejects drift between production telemetry declarations and the registry.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

env:
  CARGO_TERM_COLOR: always
  WEAVER_VERSION: v0.24.2

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semconv-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ./rust/otap-dataflow
          cache-bin: false
      - name: Setup Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@adcf6fda79c3df1cb537669442aef753b7019777 # v0.24.2
        with:
          version: ${{ env.WEAVER_VERSION }}
      - name: Validate semantic-convention v2 registry
        run: weaver registry check --v2 --registry rust/otap-dataflow/semconv
      - name: Check semantic conventions against production Rust telemetry
        run: cargo xtask semconv-check
        working-directory: ./rust/otap-dataflow
