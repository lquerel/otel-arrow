file_format: definition/2
metrics:
- name: exporter.perf.pdata.invalid.batches
  brief: Number of invalid pdata batches received.
  instrument: counter
  unit: "{msg}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: exporter.perf.pdata
