file_format: definition/2
metrics:
- name: exporter.perf.pdata.invalid.batches
  brief: Number of invalid pdata batches received.
  instrument: counter
  unit: "{msg}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: exporter.perf.pdata
      rust:
        package: otap-df-core-nodes
        type: PerfExporterPdataMetrics
        field: invalid_batches
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/exporters/perf_exporter/metrics.rs
        temporality: delta
      wire:
        scope_name: exporter.perf.pdata
        metric_name: invalid.batches
