  instrument: counter
  unit: "{msg}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.messages.received
  brief: Total messages received from Kafka across all signal types
  instrument: counter
  unit: "{msg}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.metric.msgs.received
  brief: Number of metric messages received from the kafka broker
  instrument: counter
  unit: "{msg}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.nacks.received
  brief: Number of nacks received from downstream
  instrument: counter
  unit: "{nack}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.offset.commit.errors
  brief: Number of offset commits the broker rejected. Populated from the consumer
    commit callback (see [`offset_commits`]).
  instrument: counter
  unit: "{error}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.offset.commits
  brief: Number of offset commits acknowledged by the broker. Populated from the consumer
    commit callback (not at commit-issue time), so it counts commits the broker actually
    accepted - covering both the receiver's asynchronous steady-state commits and
    the synchronous pre-rebalance commit-before-revoke.
  instrument: counter
  unit: "{commit}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.partitions.assigned
  brief: Partitions newly acquired by this consumer across rebalances (retained partitions
    are not re-counted)
  instrument: counter
  unit: "{partition}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.partitions.revoked
  brief: Genuinely-owned partitions revoked from this consumer across rebalances
