file_format: definition/2
metrics:
- name: receiver.kafka.acks.for.revoked.partition
  brief: Acks/nacks skipped because the partition was no longer assigned
  instrument: counter
  unit: "{ack}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
      rust:
        package: otap-df-contrib-nodes
        type: KafkaReceiverMetrics
        field: acks_for_revoked_partition
        instrument: Counter
        value_type: u64
        source: crates/contrib-nodes/src/receivers/kafka_receiver/metrics.rs
        temporality: delta
        availability: feature = "kafka-receiver"
      wire:
        scope_name: receiver.kafka
        metric_name: acks.for.revoked.partition
