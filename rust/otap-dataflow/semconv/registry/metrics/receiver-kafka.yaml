file_format: definition/2
metrics:
- name: receiver.kafka.acks.for.revoked.partition
  brief: Acks/nacks skipped because the partition was no longer assigned
  instrument: counter
  unit: "{ack}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.acks.received
  brief: Number of acks received from downstream
  instrument: counter
  unit: "{ack}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.bytes.received
  brief: Total payload bytes consumed from Kafka
  instrument: counter
  unit: "{byte}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka
- name: receiver.kafka.empty.payloads
  brief: Messages with empty payload
  instrument: counter
  unit: "{msg}"
  stability: development
