file_format: definition/2
metrics:
- name: exporter.kafka.acks.received
  brief: Number of acks received from downstream.
  instrument: counter
  unit: "{batch}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: exporter.kafka
- name: exporter.kafka.logs.exported
