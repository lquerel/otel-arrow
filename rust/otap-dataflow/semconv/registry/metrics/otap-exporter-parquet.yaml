file_format: definition/2
metrics:
- name: otap.exporter.parquet.files.closed
  brief: Number of Parquet files successfully closed (flushed and visible to readers).
  instrument: counter
  unit: "{file}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.exporter.parquet
      rust:
        package: otap-df-core-nodes
        type: ParquetExporterMetrics
        field: files_closed
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/exporters/parquet_exporter/metrics.rs
        temporality: delta
      wire:
        scope_name: otap.exporter.parquet
        metric_name: files.closed
