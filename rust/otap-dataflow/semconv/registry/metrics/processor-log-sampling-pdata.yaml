file_format: definition/2
metrics:
- name: processor.log_sampling.pdata.filter.buffer.reclamation.failures
  brief: How many times we fail to reclaim the underlying filter buffer.
  instrument: counter
  unit: "{error}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.log_sampling.pdata
      rust:
        package: otap-df-core-nodes
        type: LogSamplingMetrics
        field: filter_buffer_reclamation_failures
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/processors/log_sampling_processor/metrics.rs
        temporality: delta
      wire:
        scope_name: processor.log_sampling.pdata
        metric_name: filter.buffer.reclamation.failures
