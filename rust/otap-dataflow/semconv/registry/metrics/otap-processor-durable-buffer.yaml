    otap_dataflow:
      metric_set: otap.processor.durable_buffer
- name: otap.processor.durable_buffer.dropped.bundles
  brief: Total bundles lost due to force-dropped segments (DropOldest policy). Non-zero
    values indicate data loss.
  instrument: counter
  unit: "{bundle}"
  stability: development
  requirement_level: recommended
  entity_associations:
