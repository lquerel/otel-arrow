file_format: definition/2
metrics:
- name: otap.processor.durable_buffer.bundles.acked
  brief: Number of bundles acknowledged by downstream.
  instrument: counter
  unit: "{bundle}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.processor.durable_buffer
- name: otap.processor.durable_buffer.bundles.nacked.deferred
  brief: Number of bundles deferred for retry after transient downstream failures.
  instrument: counter
  unit: "{bundle}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.processor.durable_buffer
- name: otap.processor.durable_buffer.bundles.nacked.permanent
  brief: Number of bundles permanently rejected by downstream (not retried). These
    indicate data loss due to permanent failures (e.g., malformed data).
  instrument: counter
  unit: "{bundle}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.processor.durable_buffer
- name: otap.processor.durable_buffer.consumed.log.records
  brief: Number of log records consumed (ingested to durable storage). For OTLP bytes,
    counted by scanning the protobuf wire format without full deserialization.
  instrument: counter
  unit: "{log_record}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.processor.durable_buffer
