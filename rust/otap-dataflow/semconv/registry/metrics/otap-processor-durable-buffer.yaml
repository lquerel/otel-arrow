  unit: "{data_point}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.processor.durable_buffer
- name: otap.processor.durable_buffer.consumed.spans
