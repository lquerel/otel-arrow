file_format: definition/2
metrics:
- name: processor.content_router.signals.conversion.error
  brief: Number of messages that failed due to internal conversion errors.
  instrument: counter
  unit: "{msg}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.content_router
      rust:
        package: otap-df-core-nodes
        type: ContentRouterMetrics
        field: signals_conversion_error
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/processors/content_router/mod.rs
        temporality: delta
      wire:
        scope_name: processor.content_router
        metric_name: signals.conversion.error
