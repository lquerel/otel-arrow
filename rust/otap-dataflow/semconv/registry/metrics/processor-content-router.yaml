file_format: definition/2
metrics:
- name: processor.content_router.signals.conversion.error
  brief: Number of messages that failed due to internal conversion errors.
  instrument: counter
  unit: "{msg}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.content_router
- name: processor.content_router.signals.nacked
