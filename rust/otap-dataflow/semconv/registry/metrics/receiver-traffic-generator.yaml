file_format: definition/2
metrics:
- name: receiver.traffic_generator.logs.bytes.produced
  brief: Total uncompressed bytes of log payloads produced (protobuf-encoded size
    before compression). Together with `logs_produced`, this yields the average uncompressed
    bytes per log record for compression-ratio analysis.
  instrument: counter
  unit: By
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.traffic_generator
      rust:
        package: otap-df-core-nodes
        type: TrafficGeneratorReceiverMetrics
        field: logs_bytes_produced
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/receivers/traffic_generator/metrics.rs
        temporality: delta
        availability: feature = "dev-tools"
      wire:
        scope_name: receiver.traffic_generator
        metric_name: logs.bytes.produced
