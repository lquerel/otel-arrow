file_format: definition/2
metrics:
- name: receiver.otlp.acks.nacks.invalid.or.expired
  brief: Number of invalid/expired acks/nacks.
  instrument: counter
  unit: "{ack_or_nack}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
      rust:
        package: otap-df-otap
        type: OtlpReceiverMetrics
        field: acks_nacks_invalid_or_expired
        instrument: Counter
        value_type: u64
        source: crates/otap/src/otlp_metrics.rs
        temporality: delta
      wire:
        scope_name: receiver.otlp
        metric_name: acks.nacks.invalid.or.expired
