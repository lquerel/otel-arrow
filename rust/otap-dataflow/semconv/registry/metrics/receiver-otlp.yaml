file_format: definition/2
metrics:
- name: receiver.otlp.acks.nacks.invalid.or.expired
  brief: Number of invalid/expired acks/nacks.
  instrument: counter
  unit: "{ack_or_nack}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
- name: receiver.otlp.acks.received
  brief: Number of acks received from downstream (routed back to the caller).
  instrument: counter
  unit: "{acks}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
- name: receiver.otlp.nacks.received
  brief: Number of nacks received from downstream (routed back to the caller).
  instrument: counter
  unit: "{nacks}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
- name: receiver.otlp.refused.memory.pressure
  brief: Number of OTLP RPCs rejected specifically because process-wide memory pressure
    was active.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
- name: receiver.otlp.rejected.requests
  brief: Number of OTLP RPCs rejected before entering the pipeline (e.g. slot exhaustion).
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
- name: receiver.otlp.request.bytes
  brief: Total decompressed payload bytes for successfully received OTLP requests.
  instrument: counter
  unit: By
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
- name: receiver.otlp.requests.completed
  brief: Number of OTLP RPCs completed (success + nack).
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
- name: receiver.otlp.requests.started
  brief: Number of OTLP RPCs started.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
- name: receiver.otlp.transport.errors
  brief: Number of transport-level errors surfaced by tonic/server.
  instrument: counter
  unit: "{errors}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otlp
