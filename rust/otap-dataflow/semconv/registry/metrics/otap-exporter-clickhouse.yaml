file_format: definition/2
metrics:
- name: otap.exporter.clickhouse.log.rows.written
  brief: Total number of log rows written successfully into clickhouse
  instrument: counter
  unit: "{row}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.exporter.clickhouse
      rust:
        package: otap-df-contrib-nodes
        type: ClickhouseExporterMetrics
        field: log_rows_written
        instrument: Counter
        value_type: u64
        source: crates/contrib-nodes/src/exporters/clickhouse_exporter/metrics.rs
        temporality: delta
        availability: feature = "clickhouse-exporter"
      wire:
        scope_name: otap.exporter.clickhouse
        metric_name: log.rows.written
- name: otap.exporter.clickhouse.trace.rows.written
  brief: Total number of trace rows written successfully into clickhouse
  instrument: counter
  unit: "{row}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.exporter.clickhouse
      rust:
        package: otap-df-contrib-nodes
        type: ClickhouseExporterMetrics
        field: trace_rows_written
        instrument: Counter
        value_type: u64
        source: crates/contrib-nodes/src/exporters/clickhouse_exporter/metrics.rs
        temporality: delta
        availability: feature = "clickhouse-exporter"
      wire:
        scope_name: otap.exporter.clickhouse
        metric_name: trace.rows.written
