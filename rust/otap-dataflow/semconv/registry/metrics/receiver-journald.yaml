file_format: definition/2
metrics:
- name: receiver.journald.acks
  brief: Number of downstream Acks observed.
  instrument: counter
  unit: "{ack}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.journald
      rust:
        package: otap-df-core-nodes
        type: JournaldReceiverMetrics
        field: acks
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/receivers/journald_receiver/mod.rs
        temporality: delta
      wire:
        scope_name: receiver.journald
        metric_name: acks
