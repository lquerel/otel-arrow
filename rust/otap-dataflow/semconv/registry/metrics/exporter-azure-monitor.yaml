file_format: definition/2
metrics:
- name: exporter.azure_monitor.batch.size
  brief: Compressed batch size in bytes (min/max/sum/count). Recorded once per batch;
    HTTP retries do not produce additional observations.
  instrument: histogram
  unit: By
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: exporter.azure_monitor
      rust:
        package: otap-df-contrib-nodes
        type: AzureMonitorExporterMetrics
        field: batch_size
        instrument: Mmsc
        value_type: f64
        source: crates/contrib-nodes/src/exporters/azure_monitor_exporter/metrics.rs
        temporality: delta
        availability: feature = "azure-monitor-exporter"
      wire:
        scope_name: exporter.azure_monitor
        metric_name: batch.size
