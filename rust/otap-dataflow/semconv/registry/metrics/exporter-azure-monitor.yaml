file_format: definition/2
metrics:
- name: exporter.azure_monitor.batch.size
  brief: Compressed batch size in bytes (min/max/sum/count). Recorded once per batch;
    HTTP retries do not produce additional observations.
  instrument: histogram
  unit: By
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: exporter.azure_monitor
- name: exporter.azure_monitor.batch.to.msg.count
  brief: Current number of batch-to-message mappings (leak detector).
  instrument: gauge
  unit: "{entry}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: exporter.azure_monitor
- name: exporter.azure_monitor.batch.uncompressed.size
  brief: Uncompressed batch size in bytes (min/max/sum/count). Recorded once per batch,
    before compression.
  instrument: histogram
  unit: By
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: exporter.azure_monitor
- name: exporter.azure_monitor.failed.batches
  brief: Number of batches that failed to export.
  instrument: counter
