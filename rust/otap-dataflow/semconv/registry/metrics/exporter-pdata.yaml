file_format: definition/2
metrics:
- name: exporter.pdata.logs.consumed
  brief: Number of pdata logs consumed by this exporter.
  instrument: counter
  unit: "{msg}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: exporter.pdata
