file_format: definition/2
metrics:
- name: exporter.topic.dropped.messages.on.full
  brief: Number of messages dropped due to queue full policy.
  instrument: counter
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.topic
    - otap.node.custom.topic
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: exporter.topic
      rust:
        package: otap-df-core-nodes
        type: TopicExporterMetrics
        field: dropped_messages_on_full
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/exporters/topic_exporter/mod.rs
        temporality: delta
      wire:
        scope_name: exporter.topic
        metric_name: dropped.messages.on.full
