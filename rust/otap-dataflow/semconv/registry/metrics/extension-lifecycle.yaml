file_format: definition/2
metrics:
- name: extension.lifecycle.completed.cancelled
  brief: Metric for the OTAP Dataflow internal telemetry extension.lifecycle.completed.cancelled.
  instrument: counter
  unit: "{completion}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.extension
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: extension.lifecycle
      rust:
        package: otap-df-engine
        type: ExtensionLifecycleMetrics
        field: completed_cancelled
        instrument: Counter
        value_type: u64
        source: crates/engine/src/extension_monitor.rs
        temporality: delta
      wire:
        scope_name: extension.lifecycle
        metric_name: completed.cancelled
