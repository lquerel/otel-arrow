        source: crates/contrib-nodes/src/receivers/etw_receiver/mod.rs
        temporality: delta
        availability: all (feature = "etw-receiver" , target_os = "windows")
      wire:
        scope_name: receiver.etw
        metric_name: kernel.real.time.buffers.lost
- name: receiver.etw.received.events.dropped.slow.worker
  brief: Events dropped because the consuming worker (this core's async receiver loop)
    couldn't drain the internal channel fast enough (the ETW consumer thread filled
    it). Contrast `received_events_forward_failed`, which is downstream backpressure.
  instrument: counter
  unit: "{event}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
