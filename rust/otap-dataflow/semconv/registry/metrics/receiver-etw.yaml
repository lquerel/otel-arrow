        temporality: delta
        availability: all (feature = "etw-receiver" , target_os = "windows")
      wire:
        scope_name: receiver.etw
        metric_name: received.events.rejected.memory.pressure
- name: receiver.etw.received.events.total
  brief: Total number of ETW events the session **produced** - counted on the producer
    (`ProcessTrace`) side before any channel send, including events about to be dropped
    due to a full per-core channel. This is the ingress denominator and the authoritative
    total. The slow-worker drop rate is `received_events_dropped_slow_worker / received_events_total`.
    See the "Counter algebra" section on [`EtwReceiverMetrics`].
  instrument: counter
  unit: "{event}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.etw
      rust:
        package: otap-df-contrib-nodes
        type: EtwReceiverMetrics
        field: received_events_total
        instrument: Counter
        value_type: u64
        source: crates/contrib-nodes/src/receivers/etw_receiver/mod.rs
        temporality: delta
        availability: all (feature = "etw-receiver" , target_os = "windows")
      wire:
        scope_name: receiver.etw
        metric_name: received.events.total
