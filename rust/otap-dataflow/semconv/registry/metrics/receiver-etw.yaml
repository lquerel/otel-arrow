      rust:
        package: otap-df-contrib-nodes
        type: EtwReceiverMetrics
        field: received_events_dropped_slow_worker
        instrument: Counter
        value_type: u64
        source: crates/contrib-nodes/src/receivers/etw_receiver/mod.rs
        temporality: delta
        availability: all (feature = "etw-receiver" , target_os = "windows")
      wire:
        scope_name: receiver.etw
        metric_name: received.events.dropped.slow.worker
- name: receiver.etw.received.events.forward.failed
  brief: Number of ETW events that could not be forwarded downstream and were therefore
    dropped. Counts both batch `build()` failures (an encoding bug) and send failures
    (the downstream channel was full or closed).
  instrument: counter
  unit: "{event}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
