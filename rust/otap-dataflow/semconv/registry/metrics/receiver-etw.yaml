file_format: definition/2
metrics:
- name: receiver.etw.kernel.buffers.written
  brief: Total ETW buffers written by the session, from `TraceStats::buffers_written`.
    A throughput/health denominator rather than a loss signal.
  instrument: counter
  unit: "{buffer}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.etw
      rust:
        package: otap-df-contrib-nodes
        type: EtwReceiverMetrics
        field: kernel_buffers_written
        instrument: Counter
        value_type: u64
        source: crates/contrib-nodes/src/receivers/etw_receiver/mod.rs
        temporality: delta
        availability: all (feature = "etw-receiver" , target_os = "windows")
      wire:
        scope_name: receiver.etw
        metric_name: kernel.buffers.written
- name: receiver.etw.kernel.log.buffers.lost
  brief: Log buffers that could not be flushed, from `TraceStats::log_buffers_lost`.
  instrument: counter
  unit: "{buffer}"
  stability: development
  requirement_level: recommended
  entity_associations:
