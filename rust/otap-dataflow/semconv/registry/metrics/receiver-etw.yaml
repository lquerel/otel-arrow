- name: receiver.etw.received.events.lost.kernel
  brief: Events lost inside the kernel ETW buffers before `one_collect` ever saw them
    (buffer overrun), from `TraceStats::events_lost`. Distinct from `received_events_dropped_slow_worker`,
    which is our own downstream backpressure after the event was already received.
  instrument: counter
  unit: "{event}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.etw
      rust:
        package: otap-df-contrib-nodes
        type: EtwReceiverMetrics
        field: received_events_lost_kernel
        instrument: Counter
        value_type: u64
        source: crates/contrib-nodes/src/receivers/etw_receiver/mod.rs
        temporality: delta
        availability: all (feature = "etw-receiver" , target_os = "windows")
      wire:
        scope_name: receiver.etw
        metric_name: received.events.lost.kernel
- name: receiver.etw.received.events.rejected.memory.pressure
