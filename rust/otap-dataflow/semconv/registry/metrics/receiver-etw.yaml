        metric_name: kernel.log.buffers.lost
- name: receiver.etw.kernel.real.time.buffers.lost
  brief: Real-time delivery buffers lost because the consumer could not drain the
    ETW real-time buffers fast enough, from `TraceStats::real_time_buffers_lost`.
  instrument: counter
  unit: "{buffer}"
  stability: development
