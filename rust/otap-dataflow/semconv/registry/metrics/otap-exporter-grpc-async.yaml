file_format: definition/2
metrics:
- name: otap.exporter.grpc.async.export.rpc.duration
  brief: End-to-end duration from yielding a batch to receiving the matching OTAP
    stream response.
  instrument: histogram
  unit: ns
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: otap.exporter.grpc.async
      rust:
        field: export_rpc_duration_ns
- name: otap.exporter.grpc.async.export.rpc.duration.p50
  brief: Median outbound gRPC export response duration for the latest telemetry interval.
  instrument: gauge
  unit: ns
  stability: development
