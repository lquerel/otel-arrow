file_format: definition/2
metrics:
- name: processor.fanout.acked
  brief: Requests acked upstream (after await_ack/fallback aggregation).
  instrument: counter
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.fanout
- name: processor.fanout.in.flight
  brief: Current number of in-flight requests tracked by the processor.
  instrument: gauge
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.fanout
- name: processor.fanout.max.inflight.config
  brief: Configured max_inflight value (0 means unlimited).
  instrument: gauge
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.fanout
- name: processor.fanout.nacked
  brief: Requests nacked upstream (after await_ack/fallback aggregation).
  instrument: counter
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.fanout
- name: processor.fanout.sent
  brief: 'Requests dispatched. Note: This is a convenience metric that overlaps with
    channel-level send metrics. Consider removing if metric bloat is a concern.'
  instrument: counter
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.fanout
- name: processor.fanout.throttle.episodes
  brief: Increments on transition from not-throttled to throttled.
  instrument: counter
  unit: "{episode}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.fanout
- name: processor.fanout.throttled
  brief: 1 when fanout is currently refusing new pdata via accept_pdata(), else 0.
  instrument: gauge
  unit: '1'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.fanout
- name: processor.fanout.timed.out
  brief: Metric for the OTAP Dataflow internal telemetry processor.fanout.timed.out.
  instrument: counter
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.fanout
