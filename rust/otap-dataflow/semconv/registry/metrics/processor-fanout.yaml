file_format: definition/2
metrics:
- name: processor.fanout.acked
  brief: Requests acked upstream (after await_ack/fallback aggregation).
  instrument: counter
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.fanout
      rust:
        package: otap-df-core-nodes
        type: FanoutMetrics
        field: acked
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/processors/fanout_processor/mod.rs
        temporality: delta
      wire:
        scope_name: processor.fanout
        metric_name: acked
