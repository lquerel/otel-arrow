file_format: definition/2
metrics:
- name: channel.sender.send.count
  brief: Count of messages successfully sent to the channel.
  instrument: counter
  unit: "{message}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.sender
      rust:
        package: otap-df-engine
        type: ChannelSenderMetrics
        field: send_count
        instrument: Counter
        value_type: u64
        source: crates/engine/src/channel_metrics.rs
        temporality: delta
      wire:
        scope_name: channel.sender
        metric_name: send.count
- name: channel.sender.send.error_closed
