file_format: definition/2
metrics:
- name: node.producer.produced.duration
  brief: 'Duration from production until the corresponding ack or nack is routed,
    in nanoseconds. This is reported at the detailed level, only in receivers. Processors
    report consumed_refused. TODO: make this Option<Box<Mmsc or Histogram>>.'
  instrument: histogram
  unit: ns
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.node.channel
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: node.producer
      rust:
        package: otap-df-engine
        type: ProducedMetrics
        field: produced_duration_ns
        instrument: Mmsc
        value_type: f64
        source: crates/engine/src/channel_metrics.rs
        temporality: delta
      wire:
        scope_name: node.producer
        metric_name: produced.duration
- name: node.producer.produced.failure
  brief: Produced requests that failed, this are retryable errors.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.node.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: node.producer
      rust:
        package: otap-df-engine
        type: ProducedMetrics
        field: produced_failure
        instrument: Counter
        value_type: u64
        source: crates/engine/src/channel_metrics.rs
        temporality: delta
      wire:
        scope_name: node.producer
        metric_name: produced.failure
- name: node.producer.produced.refused
