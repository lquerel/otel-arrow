file_format: definition/2
metrics:
- name: node.producer.produced.duration
  brief: 'Duration from production until the corresponding ack or nack is routed,
    in nanoseconds. This is reported at the detailed level, only in receivers. Processors
    report consumed_refused. TODO: make this Option<Box<Mmsc or Histogram>>.'
  instrument: histogram
  unit: ns
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.node.channel
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: node.producer
      rust:
        field: produced_duration_ns
- name: node.producer.produced.failure
  brief: Produced requests that failed, this are retryable errors.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.node.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: node.producer
- name: node.producer.produced.refused
  brief: Produced requests refused, also known as permanent failures.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.node.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: node.producer
- name: node.producer.produced.success
  brief: Produced requests acknowledged by downstream.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.node.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: node.producer
