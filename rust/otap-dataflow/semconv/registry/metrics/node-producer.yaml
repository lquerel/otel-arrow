        temporality: delta
      wire:
        scope_name: node.producer
        metric_name: produced.refused
- name: node.producer.produced.success
  brief: Produced requests acknowledged by downstream.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
