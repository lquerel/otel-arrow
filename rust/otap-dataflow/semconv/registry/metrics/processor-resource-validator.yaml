file_format: definition/2
metrics:
- name: processor.resource_validator.batches.accepted
  brief: Number of batches that passed validation
  instrument: counter
  unit: "{batch}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.resource_validator
      rust:
        package: otap-df-contrib-nodes
        type: ResourceValidatorMetrics
        field: batches_accepted
        instrument: Counter
        value_type: u64
        source: crates/contrib-nodes/src/processors/resource_validator_processor/metrics.rs
        temporality: delta
        availability: feature = "resource-validator-processor"
      wire:
        scope_name: processor.resource_validator
        metric_name: batches.accepted
