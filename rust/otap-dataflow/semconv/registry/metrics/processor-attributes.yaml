file_format: definition/2
metrics:
- name: processor.attributes.deleted.entries
  brief: Total number of attribute entries actually deleted.
  instrument: counter
  unit: "{attr}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.attributes
