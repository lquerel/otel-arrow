file_format: definition/2
metrics:
- name: controller.monitor.observed_pipelines.live
  brief: Observed logical pipelines currently considered live.
  instrument: gauge
  unit: "{pipeline}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.controller.monitor
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: controller.monitor
      rust:
        package: otap-df-controller
        type: ControllerMonitorMetrics
        field: observed_pipelines_live
        instrument: Gauge
        value_type: u64
        source: crates/controller/src/controller_monitor.rs
      wire:
        scope_name: controller.monitor
        metric_name: observed_pipelines.live
