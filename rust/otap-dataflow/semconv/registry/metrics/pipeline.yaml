file_format: definition/2
metrics:
- name: pipeline.context.switches.involuntary
  brief: Number of times the pipeline thread was preempted by the scheduler since
    start. A rising rate often indicates CPU contention or time-slice expirations.
    When paired with `cpu_utilization`, it helps diagnose CPU time lost to preemption.
  instrument: counter
  unit: "{1}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.pipeline
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: pipeline
      rust:
        package: otap-df-engine
        type: PipelineMetrics
        field: context_switches_involuntary
        instrument: ObserveCounter
        value_type: u64
        source: crates/engine/src/pipeline_metrics.rs
        temporality: cumulative
      wire:
        scope_name: pipeline
        metric_name: context.switches.involuntary
- name: pipeline.context.switches.voluntary
  brief: Number of times the pipeline thread voluntarily yielded the CPU since start.
    A rising rate can indicate scheduling pressure due to blocking work (I/O, locks,
    backpressure) and helps distinguish "waiting" from "CPU-bound".
  instrument: counter
  unit: "{1}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.pipeline
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: pipeline
      rust:
        package: otap-df-engine
        type: PipelineMetrics
        field: context_switches_voluntary
        instrument: ObserveCounter
        value_type: u64
        source: crates/engine/src/pipeline_metrics.rs
        temporality: cumulative
      wire:
        scope_name: pipeline
        metric_name: context.switches.voluntary
- name: pipeline.cpu.time
  brief: Total CPU seconds used by the pipeline since start.
  instrument: counter
  unit: "{s}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.pipeline
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: pipeline
      rust:
        package: otap-df-engine
        type: PipelineMetrics
        field: cpu_time
        instrument: Counter
        value_type: f64
        source: crates/engine/src/pipeline_metrics.rs
        temporality: delta
      wire:
        scope_name: pipeline
        metric_name: cpu.time
- name: pipeline.cpu.utilization
  brief: Difference in pipeline cpu time since the last measurement, divided by the
    elapsed time. Reported as a ratio in the range [0, 1].
  instrument: gauge
  unit: "{1}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.pipeline
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: pipeline
      rust:
        package: otap-df-engine
        type: PipelineMetrics
        field: cpu_utilization
        instrument: Gauge
        value_type: f64
        source: crates/engine/src/pipeline_metrics.rs
      wire:
        scope_name: pipeline
        metric_name: cpu.utilization
