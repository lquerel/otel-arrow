        source: crates/engine/src/pipeline_metrics.rs
        temporality: cumulative
      wire:
        scope_name: pipeline
        metric_name: page.faults.major
- name: pipeline.page.faults.minor
  brief: Number of minor page faults (served without disk I/O) since start. A rising
    rate indicates memory access pain (poor locality, working-set churn), even if
    heap bytes are stable.
  instrument: counter
  unit: "{1}"
  stability: development
  requirement_level: recommended
  entity_associations:
