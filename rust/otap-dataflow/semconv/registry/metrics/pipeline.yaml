- name: pipeline.page.faults.major
  brief: Number of major page faults (requiring disk I/O) since start. Any non-trivial
    rate typically indicates severe memory pressure or swapping, and correlates strongly
    with pipeline latency spikes.
  instrument: counter
  unit: "{1}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.pipeline
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: pipeline
      rust:
