- name: receiver.syslog_cef.received.logs.truncated
  brief: Number of log records whose raw message exceeded [`MAX_MESSAGE_SIZE`] and
    were truncated before parsing. For TCP, truncation is detected precisely when
    a newline-delimited message exceeds the size limit. For UDP, it is a heuristic
    — a datagram that fills the entire receive buffer is assumed truncated, though
    a message exactly [`MAX_MESSAGE_SIZE`] bytes would also trigger this.
  instrument: counter
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
