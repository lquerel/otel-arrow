file_format: definition/2
metrics:
- name: receiver.syslog_cef.received.logs.forward.failed
  brief: Number of log records refused by downstream (backpressure/unavailable)
  instrument: counter
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.syslog_cef
      rust:
        package: otap-df-core-nodes
        type: SyslogCefReceiverMetrics
        field: received_logs_forward_failed
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/receivers/syslog_cef_receiver/mod.rs
        temporality: delta
      wire:
        scope_name: receiver.syslog_cef
        metric_name: received.logs.forward.failed
