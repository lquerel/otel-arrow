file_format: definition/2
metrics:
- name: receiver.user_events.downstream.send.blocked.ns
  brief: Total time spent waiting for downstream channel capacity.
  instrument: counter
  unit: ns
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.user_events
      rust:
        package: otap-df-contrib-nodes
        type: UserEventsReceiverMetrics
        field: downstream_send_blocked_ns
        instrument: Counter
        value_type: u64
        source: crates/contrib-nodes/src/receivers/user_events_receiver/metrics.rs
        temporality: delta
        availability: all (feature = "user_events-receiver" , target_os = "linux")
      wire:
        scope_name: receiver.user_events
        metric_name: downstream.send.blocked.ns
