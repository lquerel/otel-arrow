file_format: definition/2
metrics:
- name: otap.processor.batch.batching.errors
  brief: Number of batches for which errors encountered
  instrument: counter
  unit: "{error}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.processor.batch
      rust:
        package: otap-df-core-nodes
        type: BatchProcessorMetrics
        field: batching_errors
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/processors/batch_processor/mod.rs
        temporality: delta
      wire:
        scope_name: otap.processor.batch
        metric_name: batching.errors
