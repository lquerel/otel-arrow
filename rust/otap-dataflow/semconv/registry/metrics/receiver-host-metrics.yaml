file_format: definition/2
metrics:
- name: receiver.host_metrics.batches.sent
  brief: Number of batches sent downstream.
  instrument: counter
  unit: "{batch}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.host_metrics
      rust:
        package: otap-df-core-nodes
        type: HostMetricsReceiverMetrics
        field: batches_sent
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/receivers/host_metrics_receiver/mod.rs
        temporality: delta
      wire:
        scope_name: receiver.host_metrics
        metric_name: batches.sent
