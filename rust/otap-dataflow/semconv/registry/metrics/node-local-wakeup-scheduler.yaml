file_format: definition/2
metrics:
- name: node.local_wakeup.scheduler.cancel.ignored_shutdown
  brief: Count of cancel attempts ignored after shutdown was latched.
  instrument: counter
  unit: "{attempt}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: node.local_wakeup.scheduler
      rust:
        package: otap-df-engine
        type: NodeLocalWakeupSchedulerMetrics
        field: cancel_ignored_shutdown
        instrument: Counter
        value_type: u64
        source: crates/engine/src/node_local_scheduler.rs
        temporality: delta
      wire:
        scope_name: node.local_wakeup.scheduler
        metric_name: cancel.ignored_shutdown
