  unit: "{message}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: node.completion_emission
      rust:
        package: otap-df-engine
        type: CompletionEmissionMetrics
        field: notify_nack_routed
        instrument: Counter
        value_type: u64
        source: crates/engine/src/completion_emission_metrics.rs
        temporality: delta
      wire:
        scope_name: node.completion_emission
        metric_name: notify_nack.routed
