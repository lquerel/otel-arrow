        metric_name: consumed.refused
- name: node.consumer.consumed.success
  brief: Consumed requests successfully processed.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.node.channel
  annotations:
