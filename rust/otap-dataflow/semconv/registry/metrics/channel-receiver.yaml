file_format: definition/2
metrics:
- name: channel.receiver.capacity
  brief: Maximum channel capacity (buffer size).
  instrument: gauge
  unit: "{message}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.receiver
- name: channel.receiver.recv.count
  brief: Count of messages successfully received from the channel.
  instrument: counter
  unit: "{message}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.receiver
- name: channel.receiver.recv.error_closed
  brief: Count of receive attempts after the channel was closed.
  instrument: counter
  unit: "{1}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.receiver
- name: channel.receiver.recv.error_empty
  brief: Count of receive attempts when the channel was empty.
  instrument: counter
  unit: "{1}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.receiver
