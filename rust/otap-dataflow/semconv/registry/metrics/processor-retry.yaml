file_format: definition/2
metrics:
- name: processor.retry.consumed.items.logs.failure
  brief: Number of items consumed (logs) with outcome=failure
  instrument: counter
  unit: "{item}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.retry
      rust:
        package: otap-df-core-nodes
        type: RetryProcessorMetrics
        field: consumed_items_logs_failure
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/processors/retry_processor/mod.rs
        temporality: delta
      wire:
        scope_name: processor.retry
        metric_name: consumed.items.logs.failure
