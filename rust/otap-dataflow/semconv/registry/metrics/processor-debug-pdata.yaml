file_format: definition/2
metrics:
- name: processor.debug.pdata.events.consumed
  brief: Number of events (structured logs) consumed
  instrument: counter
  unit: "{event}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.debug.pdata
      rust:
        package: otap-df-core-nodes
        type: DebugPdataMetrics
        field: events_consumed
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/processors/debug_processor/metrics.rs
        temporality: delta
      wire:
        scope_name: processor.debug.pdata
        metric_name: events.consumed
