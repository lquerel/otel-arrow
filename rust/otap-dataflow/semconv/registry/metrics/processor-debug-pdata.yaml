file_format: definition/2
metrics:
- name: processor.debug.pdata.events.consumed
  brief: Number of events (structured logs) consumed
  instrument: counter
  unit: "{event}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.debug.pdata
