file_format: definition/2
metrics:
- name: receiver.otap.acks.nacks.invalid.or.expired
  brief: Number of invalid/expired acks/nacks.
  instrument: counter
  unit: "{ack_or_nack}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otap
      rust:
        package: otap-df-core-nodes
        type: OtapReceiverMetrics
        field: acks_nacks_invalid_or_expired
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/receivers/otap_receiver/mod.rs
        temporality: delta
      wire:
        scope_name: receiver.otap
        metric_name: acks.nacks.invalid.or.expired
