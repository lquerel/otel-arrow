file_format: definition/2
metrics:
- name: receiver.otap.acks.nacks.invalid.or.expired
  brief: Number of invalid/expired acks/nacks.
  instrument: counter
  unit: "{ack_or_nack}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otap
- name: receiver.otap.acks.sent
  brief: Number of acks sent.
  instrument: counter
  unit: "{acks}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otap
- name: receiver.otap.nacks.sent
  brief: Number of nacks sent.
  instrument: counter
  unit: "{nacks}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otap
- name: receiver.otap.refused.memory.pressure
  brief: Number of OTAP RPCs rejected specifically because memory pressure was active.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otap
- name: receiver.otap.rejected.requests
  brief: Number of OTAP RPCs rejected before entering the pipeline.
  instrument: counter
  unit: "{requests}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.otap
