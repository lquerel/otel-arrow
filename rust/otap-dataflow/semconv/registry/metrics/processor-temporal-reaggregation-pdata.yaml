        source: crates/core-nodes/src/processors/temporal_reaggregation_processor/telemetry.rs
        temporality: delta
      wire:
        scope_name: processor.temporal_reaggregation.pdata
        metric_name: flushes.overflow
- name: processor.temporal_reaggregation.pdata.flushes.timer
  brief: Number of flushes triggered by the regular timer.
  instrument: counter
