file_format: definition/2
metrics:
- name: processor.temporal_reaggregation.pdata.batches.rejected
  brief: Number of incoming batches rejected because they individually exceed some
    specified limit or fail to be processed into a view.
  instrument: counter
  unit: "{batch}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.temporal_reaggregation.pdata
      rust:
        package: otap-df-core-nodes
        type: TemporalReaggregationMetrics
        field: batches_rejected
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/processors/temporal_reaggregation_processor/telemetry.rs
        temporality: delta
      wire:
        scope_name: processor.temporal_reaggregation.pdata
        metric_name: batches.rejected
- name: processor.temporal_reaggregation.pdata.flushes.overflow
