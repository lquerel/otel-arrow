file_format: definition/2
metrics:
- name: processor.filter.pdata.log.signals.consumed
  brief: Number of log signals consumed
  instrument: counter
  unit: "{log}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.filter.pdata
      rust:
        package: otap-df-core-nodes
        type: FilterPdataMetrics
        field: log_signals_consumed
        instrument: Counter
        value_type: u64
        source: crates/core-nodes/src/processors/filter_processor/metrics.rs
        temporality: delta
      wire:
        scope_name: processor.filter.pdata
        metric_name: log.signals.consumed
