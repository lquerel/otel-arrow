    otap_dataflow:
      metric_set: engine
      rust:
        package: otap-df-engine
        type: EngineMetrics
        field: process_memory_hard_limit_bytes
        instrument: Gauge
        value_type: u64
        source: crates/engine/src/engine_metrics.rs
      wire:
        scope_name: engine
        metric_name: process.memory.hard.limit.bytes
- name: engine.process.memory.soft.limit.bytes
  brief: Effective process-wide memory limiter soft limit, in bytes.
  instrument: gauge
  unit: "{By}"
  stability: development
  requirement_level: recommended
  entity_associations:
