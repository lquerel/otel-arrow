- name: tokio.runtime.worker.noop.count
  brief: Total number of "noop" unpark events, summed across workers, since runtime
    creation. A noop unpark is when a worker is unparked but finds no work before
    parking again. This metric requires `tokio_unstable` and 64-bit atomics.
  instrument: counter
  unit: "{noop}"
  stability: development
  requirement_level: recommended
  entity_associations:
