file_format: definition/2
metrics:
- name: tokio.runtime.blocking.task.queue.size
  brief: Current number of tasks pending in the blocking thread pool. This counts
    tasks spawned using `spawn_blocking` that have not yet started.
  instrument: updowncounter
  unit: "{task}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.pipeline
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: tokio.runtime
      rust:
        package: otap-df-engine
        type: TokioRuntimeMetrics
        field: blocking_task_queue_size
        instrument: ObserveUpDownCounter
        value_type: u64
        source: crates/engine/src/pipeline_metrics.rs
        temporality: cumulative
        availability: tokio_unstable
      wire:
        scope_name: tokio.runtime
        metric_name: blocking.task.queue.size
