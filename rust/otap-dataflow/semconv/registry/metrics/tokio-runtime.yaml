- name: tokio.runtime.worker.busy.time
  brief: Total worker busy time, summed across all runtime workers, since runtime
    creation. With multiple workers, this sum can exceed wall-clock time because workers
    can be busy concurrently. This metric is only available on targets with 64-bit
    atomics.
  instrument: counter
  unit: "{s}"
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.pipeline
  annotations:
    code_generation:
