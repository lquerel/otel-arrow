    rust:
      package: otap-df-core-nodes
      type: BatchProcessorMetrics
  - id: pipeline
    rust:
      package: otap-df-engine
      type: PipelineMetrics
  - id: pipeline.completion
    rust:
      package: otap-df-engine
      type: PipelineCompletionMetrics
  - id: pipeline.runtime_control
    rust:
      package: otap-df-engine
      type: RuntimeControlMetrics
