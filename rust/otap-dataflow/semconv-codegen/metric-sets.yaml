  - id: receiver.otlp.transport
    rust:
      package: otap-df-otap
      type: OtlpTransportMetrics
  - id: receiver.syslog_cef
    rust:
      package: otap-df-core-nodes
      type: SyslogCefReceiverMetrics
  - id: receiver.topic
    rust:
      package: otap-df-core-nodes
      type: TopicReceiverMetrics
  - id: receiver.traffic_generator
    availability: feature = "dev-tools"
    rust:
      package: otap-df-core-nodes
      type: TrafficGeneratorReceiverMetrics
  - id: receiver.user_events
    availability: all (feature = "user_events-receiver" , target_os = "linux")
