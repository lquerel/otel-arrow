params:
  schema: otap-dataflow/metric-sets/1
  metric_sets:
  - id: admission.rate_limiter
    rust:
      package: otap-df-engine
      type: RateAdmissionMetrics
  - id: channel.receiver
    rust:
      package: otap-df-engine
      types:
      - type: ChannelReceiverMetrics
        metrics:
        - channel.receiver.messages
      - type: ChannelReceiverStateMetrics
        metrics:
        - channel.receiver.capacity
        - channel.receiver.queue.depth
      - type: ControlChannelReceiverMetrics
        metrics:
        - channel.receiver.capacity
        - channel.receiver.messages
        - channel.receiver.queue.depth
  - id: channel.sender
    rust:
      package: otap-df-engine
      types:
      - type: ChannelSenderFailureMetrics
        metrics:
        - channel.sender.failures
      - type: ChannelSenderMetrics
        metrics:
        - channel.sender.messages
      - type: ControlChannelSenderFailureMetrics
        metrics:
        - channel.sender.failures
      - type: ControlChannelSenderMetrics
        metrics:
        - channel.sender.messages
  - id: controller.monitor
    rust:
      package: otap-df-controller
      type: ControllerMonitorMetrics
  - id: engine
    rust:
      package: otap-df-engine
      type: EngineMetrics
  - id: exporter.azure_monitor
    availability: feature = "azure-monitor-exporter"
    rust:
      package: otap-df-contrib-nodes
      type: AzureMonitorExporterOperationalMetrics
  - id: exporter.azure_monitor.exports
    availability: feature = "azure-monitor-exporter"
    rust:
      package: otap-df-contrib-nodes
      type: AzureMonitorExporterExportMetrics
  - id: exporter.azure_monitor.heartbeats
    availability: feature = "azure-monitor-exporter"
    rust:
      package: otap-df-contrib-nodes
      type: AzureMonitorExporterHeartbeatMetrics
  - id: exporter.azure_monitor.http
    availability: feature = "azure-monitor-exporter"
    rust:
      package: otap-df-contrib-nodes
      type: AzureMonitorExporterHttpMetrics
  - id: exporter.azure_monitor.state
    availability: feature = "azure-monitor-exporter"
    rust:
      package: otap-df-contrib-nodes
      type: AzureMonitorExporterStateMetrics
  - id: exporter.console.failures
    rust:
      package: otap-df-core-nodes
      type: ConsoleExporterFailureMetrics
  - id: exporter.exports
    rust:
      package: otap-df-otap
      type: ExporterExportMetrics
  - id: exporter.file
    rust:
      package: otap-df-core-nodes
      types:
      - type: FileFailureMetrics
        metrics:
        - exporter.file.failures
      - type: FileSignalMetrics
        metrics:
        - exporter.file.bytes
