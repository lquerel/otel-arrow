    rust:
      package: otap-df-core-nodes
      type: AttributesProcessorTransformMetrics
  - id: processor.attributes.modified
    rust:
      package: otap-df-core-nodes
      type: AttributesProcessorModifiedMetrics
  - id: processor.compute
    rust:
      package: otap-df-engine
      type: ComputeDurationMetrics
