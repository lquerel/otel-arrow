params:
  schema: otap-dataflow/metric-sets/1
  metric_sets:
  - id: channel.receiver
    rust:
      package: otap-df-engine
      type: ChannelReceiverMetrics
  - id: channel.sender
    rust:
      package: otap-df-engine
      type: ChannelSenderMetrics
  - id: controller.monitor
    rust:
      package: otap-df-controller
      type: ControllerMonitorMetrics
  - id: engine
    rust:
      package: otap-df-engine
      type: EngineMetrics
  - id: exporter.azure_monitor
    availability: feature = "azure-monitor-exporter"
    rust:
      package: otap-df-contrib-nodes
      type: AzureMonitorExporterMetrics
  - id: exporter.kafka
    availability: feature = "kafka-exporter"
    rust:
      package: otap-df-contrib-nodes
      type: KafkaExporterMetrics
  - id: exporter.pdata
    rust:
      package: otap-df-otap
      type: ExporterPDataMetrics
  - id: exporter.perf.pdata
    rust:
      package: otap-df-core-nodes
      type: PerfExporterPdataMetrics
  - id: exporter.topic
    rust:
      package: otap-df-core-nodes
      type: TopicExporterMetrics
  - id: exporter.validation
    rust:
      package: otap-df-validation
      type: ValidationExporterMetrics
  - id: extension.azure_identity_auth
    availability: feature = "azure-identity-auth-extension"
    rust:
      package: otap-df-contrib-extensions
      type: AzureIdentityAuthMetrics
  - id: extension.lifecycle
    rust:
      package: otap-df-engine
      type: ExtensionLifecycleMetrics
  - id: flow
    rust:
      package: otap-df-engine
      types:
      - type: FlowDurationMetrics
        metrics:
        - flow.compute.duration
      - type: FlowSignalsDroppedMetrics
        metrics:
        - flow.signals.dropped
      - type: FlowSignalsIncomingMetrics
        metrics:
        - flow.signals.incoming
      - type: FlowSignalsOutgoingMetrics
        metrics:
        - flow.signals.outgoing
  - id: node.completion_emission
    rust:
      package: otap-df-engine
      type: CompletionEmissionMetrics
  - id: node.consumer
    rust:
      package: otap-df-engine
      type: ConsumedMetrics
  - id: node.local_wakeup.scheduler
    rust:
      package: otap-df-engine
      type: NodeLocalWakeupSchedulerMetrics
  - id: node.producer
    rust:
      package: otap-df-engine
      type: ProducedMetrics
  - id: otap.exporter.clickhouse
    availability: feature = "clickhouse-exporter"
    rust:
      package: otap-df-contrib-nodes
      type: ClickhouseExporterMetrics
  - id: otap.exporter.geneva
    availability: feature = "geneva-exporter"
    rust:
      package: otap-df-contrib-nodes
      type: ExporterMetrics
  - id: otap.exporter.grpc.async
    rust:
      package: otap-df-core-nodes
      type: OtapGrpcAsyncMetrics
  - id: otap.exporter.parquet
    rust:
      package: otap-df-core-nodes
      type: ParquetExporterMetrics
  - id: otap.processor.batch
    rust:
      package: otap-df-core-nodes
      type: BatchProcessorMetrics
  - id: otap.processor.durable_buffer
    rust:
      package: otap-df-core-nodes
      type: DurableBufferMetrics
  - id: pipeline
    rust:
      package: otap-df-engine
      type: PipelineMetrics
  - id: pipeline.completion
    rust:
      package: otap-df-engine
      type: PipelineCompletionMetrics
  - id: pipeline.runtime_control
    rust:
      package: otap-df-engine
      type: RuntimeControlMetrics
  - id: processor.attributes
    rust:
      package: otap-df-core-nodes
      type: AttributesProcessorMetrics
  - id: processor.compute
    rust:
      package: otap-df-engine
      type: ComputeDurationMetrics
  - id: processor.content_router
    rust:
      package: otap-df-core-nodes
      type: ContentRouterMetrics
  - id: processor.debug.pdata
    rust:
      package: otap-df-core-nodes
      type: DebugPdataMetrics
  - id: processor.fanout
    rust:
      package: otap-df-core-nodes
      type: FanoutMetrics
  - id: processor.filter.pdata
    rust:
      package: otap-df-core-nodes
      type: FilterPdataMetrics
  - id: processor.log_sampling.pdata
    rust:
      package: otap-df-core-nodes
      type: LogSamplingMetrics
  - id: processor.resource_validator
    availability: feature = "resource-validator-processor"
    rust:
      package: otap-df-contrib-nodes
      type: ResourceValidatorMetrics
  - id: processor.retry
    rust:
      package: otap-df-core-nodes
      type: RetryProcessorMetrics
  - id: processor.signal_type_router
    rust:
      package: otap-df-core-nodes
      type: SignalTypeRouterMetrics
  - id: processor.temporal_reaggregation.pdata
    rust:
      package: otap-df-core-nodes
      type: TemporalReaggregationMetrics
  - id: processor.transform
    rust:
      package: otap-df-core-nodes
      type: Metrics
  - id: receiver.etw
    availability: all (feature = "etw-receiver" , target_os = "windows")
    rust:
      package: otap-df-contrib-nodes
      type: EtwReceiverMetrics
  - id: receiver.host_metrics
    rust:
      package: otap-df-core-nodes
      type: HostMetricsReceiverMetrics
  - id: receiver.journald
    rust:
      package: otap-df-core-nodes
      type: JournaldReceiverMetrics
  - id: receiver.kafka
    availability: feature = "kafka-receiver"
    rust:
      package: otap-df-contrib-nodes
      type: KafkaReceiverMetrics
  - id: receiver.otap
    rust:
      package: otap-df-core-nodes
      type: OtapReceiverMetrics
  - id: receiver.otlp
    rust:
      package: otap-df-otap
      type: OtlpReceiverMetrics
  - id: receiver.syslog_cef
    rust:
      package: otap-df-core-nodes
      type: SyslogCefReceiverMetrics
  - id: receiver.topic
    rust:
      package: otap-df-core-nodes
      type: TopicReceiverMetrics
  - id: receiver.traffic_generator
    availability: feature = "dev-tools"
    rust:
      package: otap-df-core-nodes
      type: TrafficGeneratorReceiverMetrics
  - id: receiver.user_events
    availability: all (feature = "user_events-receiver" , target_os = "linux")
    rust:
      package: otap-df-contrib-nodes
      type: UserEventsReceiverMetrics
  - id: tokio.runtime
    rust:
      package: otap-df-engine
      type: TokioRuntimeMetrics
