    rust:
      package: otap-df-engine
      types:
      - type: ConsumedItemMetrics
        metrics:
        - node.consumer.consumed.items
      - type: ConsumedMetrics
        metrics:
        - node.consumer.consumed.duration
        - node.consumer.consumed.messages
  - id: node.local_wakeup.scheduler
    rust:
      package: otap-df-engine
      type: NodeLocalWakeupSchedulerMetrics
  - id: node.producer
    rust:
      package: otap-df-engine
      types:
      - type: ProducedItemMetrics
        metrics:
        - node.producer.produced.items
      - type: ProducedMetrics
        metrics:
        - node.producer.produced.duration
        - node.producer.produced.messages
