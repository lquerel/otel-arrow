<marker id="native-arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="18" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#137C7C"/></marker>
<marker id="control-arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="18" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L12 5 L0 10 Z" fill="#7653AD"/></marker>
