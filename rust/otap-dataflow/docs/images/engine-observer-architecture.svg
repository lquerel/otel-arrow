<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1740" viewBox="0 0 2560 1740" role="img" aria-labelledby="title description">
<title id="title">DFE observation and control architecture</title>
<desc id="description">Application pipelines send metric snapshots to the collector and registry, logs to a bounded log queue, and lifecycle events to a separate reliable queue. Lifecycle events update observed states. A bounded observation hub receives native metric snapshots, logs tapped before enqueue, and applied lifecycle events. Observer extensions consume shared records and read state snapshots. Their named OTel events use the log queue, bypassing the observer input tap. The ITS pipeline exports registry metrics and queued logs. Controller extensions read metrics and state and manage pipelines through the control-plane API. Dashed amber paths show a proposed feedback bus carrying observer recommendations and controller outcomes.</desc>
